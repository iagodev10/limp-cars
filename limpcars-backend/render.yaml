services:
  - type: web
    name: limpcars-backend
    env: node
    buildCommand: npm run build && npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_EMAIL
        sync: false  # Configure manualmente no painel do Render
      - key: ADMIN_SENHA
        sync: false  # Configure manualmente no painel do Render
      - key: VITE_API_BASE_URL
        sync: false  # Configure manualmente no painel do Render (ex: https://limpcars-oficial-1.onrender.com/api)
